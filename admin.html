<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JEWELY HUB | Admin Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    header a,
    header button {
      border: none;
      padding: 10px 16px;
      border-radius: 5px;
      text-decoration: none;
      cursor: pointer;
      margin-left: 6px;
    }

    header a {
      background: #d4af37;
      color: #111;
    }

    header button {
      background: #c62828;
      color: white;
    }

    main {
      width: 92%;
      max-width: 1150px;
      margin: 35px auto;
    }

    .card {
      background: white;
      padding: 25px;
      margin-bottom: 25px;
      border-radius: 10px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    h1 {
      margin-bottom: 25px;
    }

    h2 {
      margin-bottom: 20px;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      margin-bottom: 14px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .btn {
      background: #111;
      color: white;
      border: none;
      padding: 13px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 15px;
    }

    .btn:hover {
      background: #d4af37;
      color: #111;
    }

    .product {
      border: 1px solid #ddd;
      padding: 18px;
      margin-bottom: 15px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .product-left {
      display: flex;
      align-items: center;
      gap: 18px;
    }

    .product-image {
      width: 90px;
      height: 90px;
      border-radius: 7px;
      overflow: hidden;
      background: #eee;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 35px;
      flex-shrink: 0;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-info h3 {
      margin-bottom: 8px;
    }

    .product-info p {
      margin: 5px 0;
      color: #555;
    }

    .actions {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
    }

    .edit {
      background: #1976d2;
    }

    .delete {
      background: #c62828;
    }

    .message {
      margin-top: 15px;
      font-weight: bold;
    }

    #dashboard {
      display: none;
    }

    #login {
      max-width: 500px;
      margin: 80px auto;
    }

    .login-title {
      text-align: center;
      margin-bottom: 25px;
    }

    #editForm {
      display: none;
    }

    .cancel {
      background: #777;
      margin-left: 8px;
    }

    @media (max-width: 750px) {

      header {
        flex-direction: column;
      }

      .product {
        flex-direction: column;
        align-items: flex-start;
      }

      .product-left {
        align-items: flex-start;
      }

      .actions {
        width: 100%;
      }

      .actions button {
        flex: 1;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    JEWELY HUB ADMIN
  </div>

  <div>
    <a href="index.html">
      View Store
    </a>

    <button onclick="logout()">
      Logout
    </button>
  </div>

</header>


<!-- =========================
     LOGIN
========================= -->

<div id="login" class="card">

  <h2 class="login-title">
    Admin Login
  </h2>

  <input
    type="email"
    id="email"
    placeholder="Admin email"
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
  >

  <button
    class="btn"
    onclick="login()">
    Login
  </button>

  <div
    id="loginMessage"
    class="message">
  </div>

</div>


<!-- =========================
     DASHBOARD
========================= -->

<main id="dashboard">

  <h1>
    JEWELY HUB Product Dashboard
  </h1>


  <!-- ADD PRODUCT -->

  <div class="card">

    <h2>
      ➕ Add New Product
    </h2>

    <input
      type="text"
      id="productName"
      placeholder="Product name"
    >

    <textarea
      id="productDescription"
      placeholder="Product description"
    ></textarea>

    <input
      type="number"
      id="productPrice"
      placeholder="Price in KES"
      min="0"
    >

    <input
      type="text"
      id="productCategory"
      placeholder="Category e.g. Rings"
    >

    <input
      type="number"
      id="productStock"
      placeholder="Stock quantity"
      min="0"
    >

    <input
      type="url"
      id="productImage"
      placeholder="Public image URL"
    >

    <button
      class="btn"
      onclick="addProduct()">
      Add Product
    </button>

    <div
      id="productMessage"
      class="message">
    </div>

  </div>


  <!-- EDIT PRODUCT -->

  <div
    id="editForm"
    class="card">

    <h2>
      ✏️ Edit Product
    </h2>

    <input
      type="hidden"
      id="editId"
    >

    <input
      type="text"
      id="editName"
      placeholder="Product name"
    >

    <textarea
      id="editDescription"
      placeholder="Product description"
    ></textarea>

    <input
      type="number"
      id="editPrice"
      placeholder="Price in KES"
      min="0"
    >

    <input
      type="text"
      id="editCategory"
      placeholder="Category"
    >

    <input
      type="number"
      id="editStock"
      placeholder="Stock"
      min="0"
    >

    <input
      type="url"
      id="editImage"
      placeholder="Public image URL"
    >

    <button
      class="btn"
      onclick="updateProduct()">
      Save Changes
    </button>

    <button
      class="btn cancel"
      onclick="cancelEdit()">
      Cancel
    </button>

    <div
      id="editMessage"
      class="message">
    </div>

  </div>


  <!-- PRODUCTS -->

  <div class="card">

    <h2>
      📦 Current Products
    </h2>

    <div id="products">
      Loading products...
    </div>

  </div>

</main>


<script>

  /* ==========================================
     SUPABASE
  ========================================== */

  const SUPABASE_URL =
    "https://wghifvgqdyhwfiyqsspn.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_umNpgsluEJFq6gxkiAaKNQ_yXDLyuHl";


  /* ==========================================
     LOGIN
  ========================================== */

  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const message =
      document.getElementById("loginMessage");


    if (!email || !password) {

      message.textContent =
        "Please enter your email and password.";

      message.style.color = "red";

      return;
    }


    try {

      const response = await fetch(
        SUPABASE_URL +
        "/auth/v1/token?grant_type=password",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_PUBLISHABLE_KEY
          },

          body: JSON.stringify({
            email: email,
            password: password
          })
        }
      );


      const data =
        await response.json();


      if (!response.ok) {

        throw new Error(
          data.error_description ||
          data.msg ||
          "Login failed."
        );

      }


      localStorage.setItem(
        "access_token",
        data.access_token
      );


      showDashboard();


    } catch (error) {

      message.textContent =
        error.message;

      message.style.color = "red";

    }

  }


  /* ==========================================
     DASHBOARD
  ========================================== */

  function showDashboard() {

    document.getElementById("login")
      .style.display = "none";

    document.getElementById("dashboard")
      .style.display = "block";

    loadProducts();

  }


  function checkLogin() {

    if (
      localStorage.getItem("access_token")
    ) {

      showDashboard();

    }

  }


  /* ==========================================
     ADD PRODUCT
  ========================================== */

  async function addProduct() {

    const token =
      localStorage.getItem("access_token");


    if (!token) {

      alert("Please login first.");

      return;

    }


    const product = {

      name:
        document.getElementById("productName")
          .value.trim(),

      description:
        document.getElementById("productDescription")
          .value.trim(),

      price:
        Number(
          document.getElementById("productPrice")
            .value
        ),

      category:
        document.getElementById("productCategory")
          .value.trim(),

      stock:
        Number(
          document.getElementById("productStock")
            .value
        ),

      image_url:
        document.getElementById("productImage")
          .value.trim() || null

    };


    const message =
      document.getElementById("productMessage");


    if (
      !product.name ||
      !product.price ||
      !product.category
    ) {

      message.textContent =
        "Please enter name, price and category.";

      message.style.color = "red";

      return;

    }


    try {

      const response =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/products",
          {
            method: "POST",

            headers: {

              "Content-Type":
                "application/json",

              "apikey":
                SUPABASE_PUBLISHABLE_KEY,

              "Authorization":
                "Bearer " + token,

              "Prefer":
                "return=minimal"

            },

            body:
              JSON.stringify(product)

          }
        );


      if (!response.ok) {

        throw new Error(
          await response.text()
        );

      }


      message.textContent =
        "✅ Product added successfully!";

      message.style.color = "green";


      clearAddForm();

      loadProducts();


    } catch (error) {

      console.error(error);

      message.textContent =
        "❌ Could not add product.";

      message.style.color = "red";

    }

  }


  function clearAddForm() {

    document.getElementById("productName")
      .value = "";

    document.getElementById("productDescription")
      .value = "";

    document.getElementById("productPrice")
      .value = "";

    document.getElementById("productCategory")
      .value = "";

    document.getElementById("productStock")
      .value = "";

    document.getElementById("productImage")
      .value = "";

  }


  /* ==========================================
     LOAD PRODUCTS
  ========================================== */

  async function loadProducts() {

    const container =
      document.getElementById("products");


    try {

      const response =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/products?select=*&order=id.desc",
          {
            headers: {

              "apikey":
                SUPABASE_PUBLISHABLE_KEY,

              "Authorization":
                "Bearer " +
                SUPABASE_PUBLISHABLE_KEY

            }
          }
        );


      if (!response.ok) {

        throw new Error(
          "Could not load products."
        );

      }


      const products =
        await response.json();


      if (products.length === 0) {

        container.innerHTML =
          "<p>No products yet.</p>";

        return;

      }


      container.innerHTML = "";


      products.forEach(function(product) {

        const item =
          document.createElement("div");

        item.className =
          "product";


        const image =
          product.image_url
            ? `
              <img
                src="${product.image_url}"
                alt="${product.name}"
              >
            `
            : "💎";


        item.innerHTML = `

          <div class="product-left">

            <div class="product-image">
              ${image}
            </div>

            <div class="product-info">

              <h3>
                ${product.name}
              </h3>

              <p>
                ${product.description || ""}
              </p>

              <p>
                <strong>
                  KES ${Number(product.price)
                    .toLocaleString()}
                </strong>
              </p>

              <p>
                Category:
                ${product.category || "—"}
              </p>

              <p>
                Stock:
                ${product.stock ?? 0}
              </p>

            </div>

          </div>


          <div class="actions">

            <button
              class="btn edit"
              onclick="editProduct(${product.id})">
              Edit
            </button>

            <button
              class="btn delete"
              onclick="deleteProduct(${product.id})">
              Delete
            </button>

          </div>

        `;


        container.appendChild(item);

      });


    } catch (error) {

      console.error(error);

      container.innerHTML =
        "<p>Unable to load products.</p>";

    }

  }


  /* ==========================================
     EDIT PRODUCT
  ========================================== */

  async function editProduct(id) {

    try {

      const response =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/products?id=eq." +
          id +
          "&select=*",
          {
            headers: {

              "apikey":
                SUPABASE_PUBLISHABLE_KEY,

              "Authorization":
                "Bearer " +
                SUPABASE_PUBLISHABLE_KEY

            }
          }
        );


      const products =
        await response.json();


      if (!products.length) {

        alert("Product not found.");

        return;

      }


      const product =
        products[0];


      document.getElementById("editId")
        .value = product.id;

      document.getElementById("editName")
        .value = product.name || "";

      document.getElementById("editDescription")
        .value = product.description || "";

      document.getElementById("editPrice")
        .value = product.price || "";

      document.getElementById("editCategory")
        .value = product.category || "";

      document.getElementById("editStock")
        .value = product.stock ?? "";

      document.getElementById("editImage")
        .value = product.image_url || "";


      document.getElementById("editForm")
        .style.display = "block";


      window.scrollTo({
        top: 0,
        behavior: "smooth"
      });


    } catch (error) {

      console.error(error);

      alert("Could not open product.");

    }

  }


  /* ==========================================
     UPDATE PRODUCT
  ========================================== */

  async function updateProduct() {

    const token =
      localStorage.getItem("access_token");


    const id =
      document.getElementById("editId").value;


    const updatedProduct = {

      name:
        document.getElementById("editName")
          .value.trim(),

      description:
        document.getElementById("editDescription")
          .value.trim(),

      price:
        Number(
          document.getElementById("editPrice")
            .value
        ),

      category:
        document.getElementById("editCategory")
          .value.trim(),

      stock:
        Number(
          document.getElementById("editStock")
            .value
        ),

      image_url:
        document.getElementById("editImage")
          .value.trim() || null

    };


    const message =
      document.getElementById("editMessage");


    try {

      const response =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/products?id=eq." +
          id,
          {
            method: "PATCH",

            headers: {

              "Content-Type":
                "application/json",

              "apikey":
                SUPABASE_PUBLISHABLE_KEY,

              "Authorization":
                "Bearer " + token,

              "Prefer":
                "return=minimal"

            },

            body:
              JSON.stringify(updatedProduct)

          }
        );


      if (!response.ok) {

        throw new Error(
          await response.text()
        );

      }


      message.textContent =
        "✅ Product updated successfully!";

      message.style.color = "green";


      setTimeout(function() {

        cancelEdit();

        loadProducts();

      }, 800);


    } catch (error) {

      console.error(error);

      message.textContent =
        "❌ Could not update product.";

      message.style.color = "red";

    }

  }


  /* ==========================================
     CANCEL EDIT
  ========================================== */

  function cancelEdit() {

    document.getElementById("editForm")
      .style.display = "none";

    document.getElementById("editMessage")
      .textContent = "";

  }


  /* ==========================================
     DELETE
  ========================================== */

  async function deleteProduct(id) {

    const token =
      localStorage.getItem("access_token");


    if (
      !confirm(
        "Are you sure you want to delete this product?"
      )
    ) {

      return;

    }


    try {

      const response =
        await fetch(
          SUPABASE_URL +
          "/rest/v1/products?id=eq." +
          id,
          {
            method: "DELETE",

            headers: {

              "apikey":
                SUPABASE_PUBLISHABLE_KEY,

              "Authorization":
                "Bearer " + token

            }
          }
        );


      if (!response.ok) {

        throw new Error(
          await response.text()
        );

      }


      alert("Product deleted.");

      loadProducts();


    } catch (error) {

      console.error(error);

      alert(
        "Could not delete product."
      );

    }

  }


  /* ==========================================
     LOGOUT
  ========================================== */

  function logout() {

    localStorage.removeItem(
      "access_token"
    );

    location.reload();

  }


  /* ==========================================
     START
  ========================================== */

  checkLogin();

</script>

</body>
</html>
