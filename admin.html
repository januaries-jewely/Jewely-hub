<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JEWELY HUB | Admin Dashboard</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 20px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    .back {
      color: white;
      text-decoration: none;
      background: #d4af37;
      color: #111;
      padding: 10px 18px;
      border-radius: 4px;
    }

    main {
      width: 90%;
      max-width: 1100px;
      margin: 40px auto;
    }

    h1 {
      margin-bottom: 30px;
    }

    .card {
      background: white;
      padding: 25px;
      margin-bottom: 30px;
      border-radius: 10px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.08);
    }

    .card h2 {
      margin-bottom: 20px;
    }

    form {
      display: grid;
      gap: 15px;
    }

    input,
    textarea,
    select {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    button {
      background: #111;
      color: white;
      border: none;
      padding: 13px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 15px;
    }

    button:hover {
      background: #d4af37;
      color: #111;
    }

    .products {
      display: grid;
      gap: 15px;
    }

    .product {
      border: 1px solid #ddd;
      padding: 18px;
      border-radius: 7px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .product-info h3 {
      margin-bottom: 7px;
    }

    .product-info p {
      color: #666;
      margin: 4px 0;
    }

    .delete {
      background: #c62828;
    }

    .delete:hover {
      background: #e53935;
      color: white;
    }

    .message {
      margin-top: 15px;
      font-weight: bold;
    }

    @media (max-width: 700px) {
      .product {
        flex-direction: column;
        align-items: flex-start;
      }

      header {
        gap: 15px;
        flex-direction: column;
      }
    }
  </style>
</head>

<body>

  <header>

    <div class="logo">
      JEWELY HUB ADMIN
    </div>

    <a href="index.html" class="back">
      View Store
    </a>

  </header>


  <main>

    <h1>Product Management</h1>


    <!-- ADD PRODUCT -->

    <div class="card">

      <h2>Add New Product</h2>

      <form id="productForm">

        <input
          type="text"
          id="name"
          placeholder="Product name"
          required
        >

        <textarea
          id="description"
          placeholder="Product description"
          required
        ></textarea>

        <input
          type="number"
          id="price"
          placeholder="Price in KES"
          min="0"
          required
        >

        <input
          type="text"
          id="category"
          placeholder="Category e.g. Rings"
          required
        >

        <input
          type="number"
          id="stock"
          placeholder="Stock quantity"
          min="0"
          required
        >

        <input
          type="url"
          id="image_url"
          placeholder="Product image URL (optional)"
        >

        <button type="submit">
          Add Product
        </button>

      </form>

      <div id="message" class="message"></div>

    </div>


    <!-- PRODUCTS -->

    <div class="card">

      <h2>Current Products</h2>

      <div id="products" class="products">
        Loading products...
      </div>

    </div>

  </main>


  <script>

    /* ==========================================
       SUPABASE
       ========================================== */

    const SUPABASE_URL =
      "https://wghifvgqdyhwfiyqsspn.supabase.co";

    const SUPABASE_PUBLISHABLE_KEY =
      "sb_publishable_umNpgsluEJFq6gxkiAaKNQ_yXDLyuHl";


    /* ==========================================
       LOAD PRODUCTS
       ========================================== */

    async function loadProducts() {

      const container =
        document.getElementById("products");

      try {

        const response = await fetch(
          SUPABASE_URL +
          "/rest/v1/products?select=*",
          {
            headers: {
              "apikey": SUPABASE_PUBLISHABLE_KEY,
              "Authorization":
                "Bearer " +
                SUPABASE_PUBLISHABLE_KEY
            }
          }
        );


        if (!response.ok) {
          throw new Error("Could not load products.");
        }


        const products =
          await response.json();


        if (products.length === 0) {

          container.innerHTML =
            "<p>No products yet.</p>";

          return;
        }


        container.innerHTML = "";


        products.forEach(function(product) {

          const item =
            document.createElement("div");

          item.className = "product";


          item.innerHTML = `

            <div class="product-info">

              <h3>
                ${product.name}
              </h3>

              <p>
                ${product.description || ""}
              </p>

              <p>
                <strong>
                  KES ${Number(product.price).toLocaleString()}
                </strong>
              </p>

              <p>
                Category: ${product.category || "—"}
              </p>

              <p>
                Stock: ${product.stock ?? 0}
              </p>

            </div>

            <button
              class="delete"
              onclick="deleteProduct(${product.id})"
            >
              Delete
            </button>

          `;


          container.appendChild(item);

        });


      } catch (error) {

        container.innerHTML =
          "<p>Unable to load products.</p>";

        console.error(error);

      }

    }


    /* ==========================================
       ADD PRODUCT
       ========================================== */

    document
      .getElementById("productForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();


        const message =
          document.getElementById("message");


        const product = {

          name:
            document.getElementById("name").value,

          description:
            document.getElementById("description").value,

          price:
            Number(
              document.getElementById("price").value
            ),

          category:
            document.getElementById("category").value,

          stock:
            Number(
              document.getElementById("stock").value
            ),

          image_url:
            document.getElementById("image_url").value ||
            null

        };


        try {

          const response = await fetch(
            SUPABASE_URL + "/rest/v1/products",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json",

                "apikey":
                  SUPABASE_PUBLISHABLE_KEY,

                "Authorization":
                  "Bearer " +
                  SUPABASE_PUBLISHABLE_KEY,

                "Prefer":
                  "return=minimal"
              },

              body:
                JSON.stringify(product)
            }
          );


          if (!response.ok) {

            throw new Error(
              await response.text()
            );

          }


          message.textContent =
            "Product added successfully!";

          message.style.color = "green";


          document
            .getElementById("productForm")
            .reset();


          loadProducts();


        } catch (error) {

          console.error(error);

          message.textContent =
            "Could not add product.";

          message.style.color = "red";

        }

      });


    /* ==========================================
       DELETE PRODUCT
       ========================================== */

    async function deleteProduct(id) {

      const confirmed =
        confirm(
          "Are you sure you want to delete this product?"
        );


      if (!confirmed) {
        return;
      }


      try {

        const response = await fetch(
          SUPABASE_URL +
          "/rest/v1/products?id=eq." +
          id,
          {
            method: "DELETE",

            headers: {
              "apikey":
                SUPABASE_PUBLISHABLE_KEY,

              "Authorization":
                "Bearer " +
                SUPABASE_PUBLISHABLE_KEY
            }
          }
        );


        if (!response.ok) {
          throw new Error(
            "Delete failed."
          );
        }


        alert("Product deleted.");

        loadProducts();


      } catch (error) {

        console.error(error);

        alert(
          "Could not delete product."
        );

      }

    }


    /* ==========================================
       START
       ========================================== */

    loadProducts();

  </script>

</body>
</html>
