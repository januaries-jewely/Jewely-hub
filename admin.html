<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JEWELY HUB | Admin</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f5f5f5;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .logo {
      font-size: 24px;
      font-weight: bold;
      letter-spacing: 2px;
    }

    header a,
    header button {
      background: #d4af37;
      color: #111;
      border: none;
      padding: 10px 16px;
      border-radius: 5px;
      text-decoration: none;
      cursor: pointer;
      margin-left: 8px;
    }

    main {
      width: 92%;
      max-width: 1100px;
      margin: 35px auto;
    }

    .card {
      background: white;
      padding: 25px;
      margin-bottom: 25px;
      border-radius: 10px;
      box-shadow: 0 3px 12px rgba(0,0,0,.08);
    }

    h1 {
      margin-bottom: 25px;
    }

    h2 {
      margin-bottom: 20px;
    }

    input,
    textarea {
      width: 100%;
      padding: 13px;
      margin-bottom: 14px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 15px;
    }

    textarea {
      min-height: 100px;
      resize: vertical;
    }

    .btn {
      background: #111;
      color: white;
      border: none;
      padding: 13px 20px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 15px;
    }

    .btn:hover {
      background: #d4af37;
      color: #111;
    }

    .delete {
      background: #c62828;
    }

    .delete:hover {
      background: #e53935;
      color: white;
    }

    .product {
      border: 1px solid #ddd;
      padding: 18px;
      margin-bottom: 15px;
      border-radius: 7px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
    }

    .product h3 {
      margin-bottom: 8px;
    }

    .product p {
      margin: 5px 0;
      color: #555;
    }

    .message {
      margin-top: 15px;
      font-weight: bold;
    }

    #dashboard {
      display: none;
    }

    #login {
      max-width: 500px;
      margin: 80px auto;
    }

    .login-title {
      text-align: center;
      margin-bottom: 25px;
    }

    .logout {
      background: #c62828;
      color: white;
    }

    @media (max-width: 700px) {
      header {
        flex-direction: column;
        gap: 15px;
      }

      .product {
        flex-direction: column;
        align-items: flex-start;
      }
    }
  </style>
</head>

<body>

<header>

  <div class="logo">
    JEWELY HUB ADMIN
  </div>

  <div>
    <a href="index.html">View Store</a>

    <button
      id="logoutButton"
      class="logout"
      onclick="logout()"
      style="display:none;">
      Logout
    </button>
  </div>

</header>


<!-- =========================
     LOGIN
========================= -->

<div id="login" class="card">

  <h2 class="login-title">
    Admin Login
  </h2>

  <input
    type="email"
    id="email"
    placeholder="Admin email"
    autocomplete="email"
  >

  <input
    type="password"
    id="password"
    placeholder="Password"
    autocomplete="current-password"
  >

  <button
    class="btn"
    onclick="login()">
    Login
  </button>

  <div
    id="loginMessage"
    class="message">
  </div>

</div>


<!-- =========================
     DASHBOARD
========================= -->

<main id="dashboard">

  <h1>
    JEWELY HUB Product Dashboard
  </h1>


  <!-- ADD PRODUCT -->

  <div class="card">

    <h2>
      ➕ Add New Product
    </h2>

    <input
      type="text"
      id="productName"
      placeholder="Product name"
    >

    <textarea
      id="productDescription"
      placeholder="Product description"
    ></textarea>

    <input
      type="number"
      id="productPrice"
      placeholder="Price in KES"
      min="0"
    >

    <input
      type="text"
      id="productCategory"
      placeholder="Category e.g. Rings, Necklaces, Bracelets"
    >

    <input
      type="number"
      id="productStock"
      placeholder="Stock quantity"
      min="0"
    >

    <input
      type="url"
      id="productImage"
      placeholder="Image URL (optional)"
    >

    <button
      class="btn"
      onclick="addProduct()">
      Add Product
    </button>

    <div
      id="productMessage"
      class="message">
    </div>

  </div>


  <!-- PRODUCT LIST -->

  <div class="card">

    <h2>
      📦 Current Products
    </h2>

    <div id="products">
      Loading products...
    </div>

  </div>

</main>


<script>

  /* ==========================================
     SUPABASE SETTINGS
  ========================================== */

  const SUPABASE_URL =
    "https://wghifvgqdyhwfiyqsspn.supabase.co";

  const SUPABASE_PUBLISHABLE_KEY =
    "sb_publishable_umNpgsluEJFq6gxkiAaKNQ_yXDLyuHl";


  /* ==========================================
     LOGIN
  ========================================== */

  async function login() {

    const email =
      document.getElementById("email").value.trim();

    const password =
      document.getElementById("password").value;

    const message =
      document.getElementById("loginMessage");


    if (!email || !password) {

      message.textContent =
        "Please enter your email and password.";

      message.style.color = "red";

      return;
    }


    try {

      const response = await fetch(
        SUPABASE_URL +
        "/auth/v1/token?grant_type=password",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_PUBLISHABLE_KEY
          },

          body: JSON.stringify({
            email: email,
            password: password
          })
        }
      );


      const data = await response.json();


      if (!response.ok) {

        throw new Error(
          data.error_description ||
          data.msg ||
          "Login failed."
        );
      }


      localStorage.setItem(
        "access_token",
        data.access_token
      );

      localStorage.setItem(
        "refresh_token",
        data.refresh_token
      );


      showDashboard();


    } catch (error) {

      message.textContent =
        error.message;

      message.style.color = "red";
    }

  }


  /* ==========================================
     SHOW DASHBOARD
  ========================================== */

  function showDashboard() {

    document.getElementById("login")
      .style.display = "none";

    document.getElementById("dashboard")
      .style.display = "block";

    document.getElementById("logoutButton")
      .style.display = "inline-block";

    loadProducts();
  }


  /* ==========================================
     CHECK LOGIN
  ========================================== */

  function checkLogin() {

    const token =
      localStorage.getItem("access_token");

    if (token) {
      showDashboard();
    }

  }


  /* ==========================================
     ADD PRODUCT
  ========================================== */

  async function addProduct() {

    const token =
      localStorage.getItem("access_token");

    if (!token) {

      alert("Please login first.");

      return;
    }


    const name =
      document.getElementById("productName")
        .value.trim();

    const description =
      document.getElementById("productDescription")
        .value.trim();

    const price =
      Number(
        document.getElementById("productPrice")
          .value
      );

    const category =
      document.getElementById("productCategory")
        .value.trim();

    const stock =
      Number(
        document.getElementById("productStock")
          .value
      );

    const image_url =
      document.getElementById("productImage")
        .value.trim() || null;


    const message =
      document.getElementById("productMessage");


    if (!name || !price || !category) {

      message.textContent =
        "Please enter the product name, price and category.";

      message.style.color = "red";

      return;
    }


    try {

      const response = await fetch(
        SUPABASE_URL +
        "/rest/v1/products",
        {
          method: "POST",

          headers: {
            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_PUBLISHABLE_KEY,

            "Authorization":
              "Bearer " + token,

            "Prefer":
              "return=minimal"
          },

          body: JSON.stringify({

            name: name,

            description: description,

            price: price,

            category: category,

            stock: stock,

            image_url: image_url

          })
        }
      );


      if (!response.ok) {

        const error =
          await response.text();

        throw new Error(error);
      }


      message.textContent =
        "✅ Product added successfully!";

      message.style.color = "green";


      document.getElementById("productName")
        .value = "";

      document.getElementById("productDescription")
        .value = "";

      document.getElementById("productPrice")
        .value = "";

      document.getElementById("productCategory")
        .value = "";

      document.getElementById("productStock")
        .value = "";

      document.getElementById("productImage")
        .value = "";


      loadProducts();


    } catch (error) {

      console.error(error);

      message.textContent =
        "❌ Could not add product.";

      message.style.color = "red";
    }

  }


  /* ==========================================
     LOAD PRODUCTS
  ========================================== */

  async function loadProducts() {

    const container =
      document.getElementById("products");


    try {

      const response = await fetch(
        SUPABASE_URL +
        "/rest/v1/products?select=*&order=id.desc",
        {
          headers: {
            "apikey":
              SUPABASE_PUBLISHABLE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_PUBLISHABLE_KEY
          }
        }
      );


      if (!response.ok) {

        throw new Error(
          "Could not load products."
        );
      }


      const products =
        await response.json();


      if (products.length === 0) {

        container.innerHTML =
          "<p>No products yet.</p>";

        return;
      }


      container.innerHTML = "";


      products.forEach(function(product) {

        const item =
          document.createElement("div");

        item.className = "product";


        item.innerHTML = `

          <div>

            <h3>
              ${product.name}
            </h3>

            <p>
              ${product.description || ""}
            </p>

            <p>
              <strong>
                KES ${Number(product.price).toLocaleString()}
              </strong>
            </p>

            <p>
              Category:
              ${product.category || "—"}
            </p>

            <p>
              Stock:
              ${product.stock ?? 0}
            </p>

          </div>

          <button
            class="btn delete"
            onclick="deleteProduct(${product.id})">
            Delete
          </button>

        `;


        container.appendChild(item);

      });


    } catch (error) {

      console.error(error);

      container.innerHTML =
        "<p>Unable to load products.</p>";

    }

  }


  /* ==========================================
     DELETE PRODUCT
  ========================================== */

  async function deleteProduct(id) {

    const token =
      localStorage.getItem("access_token");


    if (!token) {

      alert("Please login first.");

      return;
    }


    if (
      !confirm(
        "Are you sure you want to delete this product?"
      )
    ) {

      return;
    }


    try {

      const response = await fetch(
        SUPABASE_URL +
        "/rest/v1/products?id=eq." +
        id,
        {
          method: "DELETE",

          headers: {
            "apikey":
              SUPABASE_PUBLISHABLE_KEY,

            "Authorization":
              "Bearer " + token
          }
        }
      );


      if (!response.ok) {

        throw new Error(
          await response.text()
        );
      }


      alert("Product deleted.");

      loadProducts();


    } catch (error) {

      console.error(error);

      alert(
        "Could not delete product."
      );

    }

  }


  /* ==========================================
     LOGOUT
  ========================================== */

  function logout() {

    localStorage.removeItem(
      "access_token"
    );

    localStorage.removeItem(
      "refresh_token"
    );


    location.reload();

  }


  /* ==========================================
     START
  ========================================== */

  checkLogin();

</script>

</body>
</html>
