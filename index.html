<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>JEWELY HUB | Luxury Jewelry</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: Arial, sans-serif;
    }

    body {
      background: #fafafa;
      color: #222;
    }

    header {
      background: #111;
      color: white;
      padding: 18px 6%;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 1000;
    }

    .logo {
      font-size: 25px;
      font-weight: bold;
      letter-spacing: 3px;
    }

    nav {
      display: flex;
      gap: 10px;
    }

    nav button {
      border: none;
      padding: 10px 16px;
      border-radius: 5px;
      cursor: pointer;
      background: #d4af37;
      color: #111;
      font-weight: bold;
    }

    .hero {
      min-height: 430px;
      display: flex;
      justify-content: center;
      align-items: center;
      text-align: center;

      background:
        linear-gradient(rgba(0,0,0,.55), rgba(0,0,0,.55)),
        url("https://images.unsplash.com/photo-1515562141207-7a88fb7ce338?auto=format&fit=crop&w=1600&q=80");

      background-size: cover;
      background-position: center;

      color: white;
      padding: 40px 20px;
    }

    .hero h1 {
      font-size: 55px;
      margin-bottom: 15px;
    }

    .hero p {
      font-size: 20px;
      margin-bottom: 25px;
    }

    .hero button {
      background: #d4af37;
      border: none;
      padding: 15px 30px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 17px;
      font-weight: bold;
    }

    .container {
      width: 92%;
      max-width: 1200px;
      margin: 40px auto;
    }

    .tools {
      display: flex;
      gap: 15px;
      margin-bottom: 30px;
      flex-wrap: wrap;
    }

    .tools input,
    .tools select {
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 15px;
    }

    .tools input {
      flex: 1;
      min-width: 220px;
    }

    .products {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
      gap: 25px;
    }

    .product {
      background: white;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 4px 15px rgba(0,0,0,.08);
      transition: transform .2s;
    }

    .product:hover {
      transform: translateY(-4px);
    }

    .product-image {
      width: 100%;
      height: 250px;
      background: #eee;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-size: 60px;
    }

    .product-image img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    .product-info {
      padding: 20px;
    }

    .product-info h3 {
      margin-bottom: 8px;
    }

    .description {
      color: #666;
      margin-bottom: 10px;
      min-height: 40px;
    }

    .category {
      color: #888;
      font-size: 14px;
      margin-bottom: 8px;
    }

    .price {
      font-size: 20px;
      font-weight: bold;
      margin-bottom: 10px;
    }

    .stock {
      color: #555;
      font-size: 14px;
      margin-bottom: 12px;
    }

    .add-cart {
      width: 100%;
      border: none;
      background: #111;
      color: white;
      padding: 13px;
      border-radius: 5px;
      cursor: pointer;
      font-weight: bold;
    }

    .add-cart:hover {
      background: #d4af37;
      color: #111;
    }

    .add-cart:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    /* CART */

    .cart-panel {
      position: fixed;
      right: -420px;
      top: 0;
      width: 400px;
      max-width: 95%;
      height: 100vh;
      background: white;
      box-shadow: -5px 0 20px rgba(0,0,0,.2);
      z-index: 2000;
      transition: right .3s;
      display: flex;
      flex-direction: column;
    }

    .cart-panel.open {
      right: 0;
    }

    .cart-header {
      padding: 20px;
      background: #111;
      color: white;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .cart-header button {
      background: none;
      border: none;
      color: white;
      font-size: 25px;
      cursor: pointer;
    }

    .cart-items {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .cart-item {
      border-bottom: 1px solid #ddd;
      padding: 15px 0;
    }

    .cart-item h4 {
      margin-bottom: 7px;
    }

    .quantity {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-top: 8px;
    }

    .quantity button {
      width: 30px;
      height: 30px;
      border: none;
      background: #111;
      color: white;
      border-radius: 4px;
      cursor: pointer;
    }

    .remove {
      margin-top: 8px;
      border: none;
      background: #c62828;
      color: white;
      padding: 7px 10px;
      border-radius: 4px;
      cursor: pointer;
    }

    .cart-footer {
      padding: 20px;
      border-top: 1px solid #ddd;
    }

    .cart-total {
      font-size: 22px;
      font-weight: bold;
      margin-bottom: 15px;
    }

    .checkout {
      width: 100%;
      padding: 15px;
      border: none;
      border-radius: 5px;
      background: #d4af37;
      color: #111;
      font-weight: bold;
      cursor: pointer;
      font-size: 16px;
    }

    /* CHECKOUT */

    .modal {
      display: none;
      position: fixed;
      z-index: 3000;
      inset: 0;
      background: rgba(0,0,0,.65);
      padding: 20px;
      overflow-y: auto;
    }

    .modal-content {
      background: white;
      max-width: 550px;
      margin: 40px auto;
      padding: 25px;
      border-radius: 10px;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .close {
      border: none;
      background: none;
      font-size: 28px;
      cursor: pointer;
    }

    .checkout-form label {
      display: block;
      font-weight: bold;
      margin: 12px 0 6px;
    }

    .checkout-form input,
    .checkout-form textarea {
      width: 100%;
      padding: 13px;
      border: 1px solid #ccc;
      border-radius: 5px;
      font-size: 15px;
    }

    .checkout-form textarea {
      min-height: 100px;
      resize: vertical;
    }

    .payment-box {
      background: #f5f5f5;
      padding: 18px;
      border-radius: 8px;
      margin: 10px 0 20px;
    }

    .payment-amount {
      font-size: 28px;
      font-weight: bold;
      margin-top: 8px;
    }

    .pay-button {
      width: 100%;
      padding: 16px;
      margin-top: 20px;
      background: #087f23;
      color: white;
      border: none;
      border-radius: 5px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .pay-button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .message {
      margin-top: 15px;
      line-height: 1.5;
      font-weight: bold;
    }

    .empty {
      text-align: center;
      color: #777;
      margin-top: 40px;
    }

    footer {
      background: #111;
      color: white;
      text-align: center;
      padding: 35px 20px;
      margin-top: 60px;
    }

    @media (max-width: 700px) {
      header {
        flex-direction: column;
        gap: 15px;
      }

      .hero h1 {
        font-size: 38px;
      }

      .cart-panel {
        width: 95%;
      }
    }
  </style>
</head>

<body>

<!-- HEADER -->

<header>
  <div class="logo">JEWELY HUB</div>

  <nav>
    <button onclick="openCart()">
      🛒 Cart (<span id="cartCount">0</span>)
    </button>

    <button onclick="window.location.href='admin.html'">
      Admin
    </button>
  </nav>
</header>


<!-- HERO -->

<section class="hero">
  <div>
    <h1>Timeless Elegance</h1>

    <p>
      Discover beautiful jewelry made to shine.
    </p>

    <button onclick="scrollToShop()">
      Shop Now
    </button>
  </div>
</section>


<!-- PRODUCTS -->

<section id="shop" class="container">

  <h2 style="margin-bottom:20px;">
    Our Collection
  </h2>

  <div class="tools">

    <input
      type="text"
      id="search"
      placeholder="Search jewelry..."
      oninput="filterProducts()"
    >

    <select
      id="category"
      onchange="filterProducts()">

      <option value="">
        All Categories
      </option>

    </select>

  </div>

  <div id="products" class="products">
    Loading products...
  </div>

</section>


<!-- SHOPPING CART -->

<div id="cartPanel" class="cart-panel">

  <div class="cart-header">

    <h2>Shopping Cart</h2>

    <button onclick="closeCart()">×</button>

  </div>

  <div id="cartItems" class="cart-items"></div>

  <div class="cart-footer">

    <div id="cartTotal" class="cart-total">
      Total: KES 0
    </div>

    <button
      class="checkout"
      onclick="openCheckout()">

      Proceed to Checkout

    </button>

  </div>

</div>


<!-- CHECKOUT MODAL -->

<div id="checkoutModal" class="modal">

  <div class="modal-content">

    <div class="modal-header">

      <h2>Customer Checkout</h2>

      <button
        class="close"
        onclick="closeCheckout()">

        ×

      </button>

    </div>


    <!-- EXACT PAYMENT AMOUNT -->

    <div class="payment-box">

      <div>
        Exact Amount to Pay:
      </div>

      <div
        id="checkoutAmount"
        class="payment-amount">

        KES 0

      </div>

    </div>


    <!-- CUSTOMER FORM -->

    <div class="checkout-form">

      <label for="customerName">
        Full Name
      </label>

      <input
        type="text"
        id="customerName"
        placeholder="Enter your full name"
        autocomplete="name"
      >


      <label for="customerPhone">
        M-Pesa Phone Number
      </label>

      <input
        type="tel"
        id="customerPhone"
        placeholder="e.g. 0712345678"
        autocomplete="tel"
      >


      <label for="customerEmail">
        Email Address
      </label>

      <input
        type="email"
        id="customerEmail"
        placeholder="Enter your email"
        autocomplete="email"
      >


      <!-- DELIVERY LOCATION -->

      <label for="deliveryLocation">
        Delivery Location / Address
      </label>

      <textarea
        id="deliveryLocation"
        placeholder="Enter your delivery location or address"
        autocomplete="street-address"
      ></textarea>


      <button
        id="payButton"
        class="pay-button"
        onclick="placeOrder()">

        Pay Now

      </button>


      <div
        id="checkoutMessage"
        class="message">
      </div>

    </div>

  </div>

</div>


<!-- FOOTER -->

<footer>

  <h3>JEWELY HUB</h3>

  <p style="margin-top:10px;">
    Beautiful jewelry for every occasion.
  </p>

  <p style="margin-top:15px;">
    © 2026 JEWELY HUB
  </p>

</footer>


<script>

/* ==========================================
   SUPABASE SETTINGS
========================================== */

const SUPABASE_URL =
  "https://wghifvgqdyhwfiyqsspn.supabase.co";

/*
  IMPORTANT:
  Put your existing sb_publishable_... key here.
*/

const SUPABASE_PUBLISHABLE_KEY =
  "sb_publishable_umNpgsluEJFq6gxkiAaKNQ_yXDLyuHl";


/* ==========================================
   STORE DATA
========================================== */

let allProducts = [];

let cart =
  JSON.parse(
    localStorage.getItem("jewelyHubCart")
  ) || [];


/* ==========================================
   SHOP NOW
========================================== */

function scrollToShop() {

  document
    .getElementById("shop")
    .scrollIntoView({
      behavior: "smooth"
    });

}


/* ==========================================
   LOAD PRODUCTS
========================================== */

async function loadProducts() {

  const container =
    document.getElementById("products");

  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/products?select=*&order=id.desc",
        {
          headers: {
            "apikey":
              SUPABASE_PUBLISHABLE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_PUBLISHABLE_KEY
          }
        }
      );


    if (!response.ok) {

      throw new Error(
        "Could not load products."
      );

    }


    allProducts =
      await response.json();


    populateCategories();

    displayProducts(allProducts);


  } catch (error) {

    console.error(error);

    container.innerHTML =
      "<p>Unable to load products.</p>";

  }

}


/* ==========================================
   CATEGORIES
========================================== */

function populateCategories() {

  const select =
    document.getElementById("category");

  const categories =
    [
      ...new Set(
        allProducts
          .map(product => product.category)
          .filter(Boolean)
      )
    ];


  select.innerHTML =
    '<option value="">All Categories</option>';


  categories.forEach(category => {

    const option =
      document.createElement("option");

    option.value =
      category;

    option.textContent =
      category;

    select.appendChild(option);

  });

}


/* ==========================================
   DISPLAY PRODUCTS
========================================== */

function displayProducts(products) {

  const container =
    document.getElementById("products");


  if (products.length === 0) {

    container.innerHTML =
      "<p>No products found.</p>";

    return;

  }


  container.innerHTML = "";


  products.forEach(product => {

    const card =
      document.createElement("div");

    card.className =
      "product";


    const image =
      product.image_url
        ? `
          <img
            src="${product.image_url}"
            alt="${product.name}"
          >
        `
        : "💎";


    const stock =
      Number(product.stock || 0);


    card.innerHTML = `

      <div class="product-image">
        ${image}
      </div>

      <div class="product-info">

        <h3>
          ${product.name}
        </h3>

        <p class="description">
          ${product.description || ""}
        </p>

        <p class="category">
          ${product.category || ""}
        </p>

        <p class="price">
          KES ${Number(product.price).toLocaleString()}
        </p>

        <p class="stock">
          ${
            stock > 0
              ? stock + " available"
              : "Out of stock"
          }
        </p>

        <button
          class="add-cart"
          ${stock <= 0 ? "disabled" : ""}
          onclick="addToCart(${product.id})">

          ${
            stock > 0
              ? "🛒 Add to Cart"
              : "Out of Stock"
          }

        </button>

      </div>
    `;


    container.appendChild(card);

  });

}


/* ==========================================
   SEARCH & CATEGORY FILTER
========================================== */

function filterProducts() {

  const search =
    document
      .getElementById("search")
      .value
      .toLowerCase();


  const category =
    document
      .getElementById("category")
      .value;


  const filtered =
    allProducts.filter(product => {

      const name =
        String(product.name || "")
          .toLowerCase();


      const matchesSearch =
        name.includes(search);


      const matchesCategory =
        !category ||
        product.category === category;


      return (
        matchesSearch &&
        matchesCategory
      );

    });


  displayProducts(filtered);

}


/* ==========================================
   ADD TO CART
========================================== */

function addToCart(id) {

  const product =
    allProducts.find(
      p => p.id === id
    );


  if (!product) return;


  const existing =
    cart.find(
      item => item.id === id
    );


  if (existing) {

    if (
      existing.quantity <
      Number(product.stock)
    ) {

      existing.quantity++;

    } else {

      alert(
        "You have reached the available stock."
      );

      return;

    }

  } else {

    cart.push({

      id:
        product.id,

      name:
        product.name,

      price:
        Number(product.price),

      image_url:
        product.image_url,

      quantity:
        1,

      stock:
        Number(product.stock)

    });

  }


  saveCart();

  updateCart();


  alert(
    product.name +
    " added to cart!"
  );

}


/* ==========================================
   SAVE CART
========================================== */

function saveCart() {

  localStorage.setItem(
    "jewelyHubCart",
    JSON.stringify(cart)
  );

}


/* ==========================================
   UPDATE CART
========================================== */

function updateCart() {

  const container =
    document.getElementById("cartItems");


  const count =
    cart.reduce(
      (total, item) =>
        total + item.quantity,
      0
    );


  document.getElementById("cartCount")
    .textContent =
      count;


  if (cart.length === 0) {

    container.innerHTML =
      `
        <p class="empty">
          Your cart is empty.
        </p>
      `;


    document.getElementById("cartTotal")
      .textContent =
        "Total: KES 0";


    return;

  }


  container.innerHTML = "";


  let total = 0;


  cart.forEach(item => {

    const subtotal =
      item.price *
      item.quantity;


    total += subtotal;


    const div =
      document.createElement("div");


    div.className =
      "cart-item";


    div.innerHTML = `

      <h4>
        ${item.name}
      </h4>

      <p>
        KES ${item.price.toLocaleString()}
      </p>

      <div class="quantity">

        <button
          onclick="changeQuantity(${item.id}, -1)">
          −
        </button>

        <strong>
          ${item.quantity}
        </strong>

        <button
          onclick="changeQuantity(${item.id}, 1)">
          +
        </button>

      </div>

      <p style="margin-top:8px;">
        Subtotal:
        <strong>
          KES ${subtotal.toLocaleString()}
        </strong>
      </p>

      <button
        class="remove"
        onclick="removeFromCart(${item.id})">

        Remove

      </button>

    `;


    container.appendChild(div);

  });


  document.getElementById("cartTotal")
    .textContent =
      "Total: KES " +
      total.toLocaleString();

}


/* ==========================================
   CHANGE QUANTITY
========================================== */

function changeQuantity(id, amount) {

  const item =
    cart.find(
      product => product.id === id
    );


  if (!item) return;


  const newQuantity =
    item.quantity +
    amount;


  if (newQuantity <= 0) {

    removeFromCart(id);

    return;

  }


  if (newQuantity > item.stock) {

    alert(
      "You cannot add more than the available stock."
    );

    return;

  }


  item.quantity =
    newQuantity;


  saveCart();

  updateCart();

}


/* ==========================================
   REMOVE PRODUCT
========================================== */

function removeFromCart(id) {

  cart =
    cart.filter(
      item => item.id !== id
    );


  saveCart();

  updateCart();

}


/* ==========================================
   CART OPEN/CLOSE
========================================== */

function openCart() {

  document
    .getElementById("cartPanel")
    .classList.add("open");

}


function closeCart() {

  document
    .getElementById("cartPanel")
    .classList.remove("open");

}


/* ==========================================
   CALCULATE EXACT TOTAL
========================================== */

function getCartTotal() {

  return cart.reduce(
    (total, item) =>
      total +
      (
        item.price *
        item.quantity
      ),
    0
  );

}


/* ==========================================
   OPEN CHECKOUT
========================================== */

function openCheckout() {

  if (cart.length === 0) {

    alert(
      "Your cart is empty."
    );

    return;

  }


  const total =
    getCartTotal();


  document
    .getElementById("checkoutAmount")
    .textContent =
      "KES " +
      total.toLocaleString();


  document
    .getElementById("checkoutModal")
    .style.display =
      "block";

}


/* ==========================================
   CLOSE CHECKOUT
========================================== */

function closeCheckout() {

  document
    .getElementById("checkoutModal")
    .style.display =
      "none";

}


/* ==========================================
   PLACE ORDER
========================================== */

async function placeOrder() {

  const name =
    document
      .getElementById("customerName")
      .value
      .trim();


  const phone =
    document
      .getElementById("customerPhone")
      .value
      .trim();


  const email =
    document
      .getElementById("customerEmail")
      .value
      .trim();


  const location =
    document
      .getElementById("deliveryLocation")
      .value
      .trim();


  const message =
    document
      .getElementById("checkoutMessage");


  const button =
    document
      .getElementById("payButton");


  /* VALIDATION */

  if (!name) {

    message.textContent =
      "Please enter your full name.";

    message.style.color =
      "red";

    return;

  }


  if (!phone) {

    message.textContent =
      "Please enter your M-Pesa phone number.";

    message.style.color =
      "red";

    return;

  }


  if (!location) {

    message.textContent =
      "Please enter your delivery location.";

    message.style.color =
      "red";

    return;

  }


  if (cart.length === 0) {

    message.textContent =
      "Your cart is empty.";

    message.style.color =
      "red";

    return;

  }


  const total =
    getCartTotal();


  const orderItems =
    cart.map(item => ({

      id:
        item.id,

      name:
        item.name,

      price:
        item.price,

      quantity:
        item.quantity

    }));


  button.disabled =
    true;


  button.textContent =
    "Creating Order...";


  try {

    const response =
      await fetch(
        SUPABASE_URL +
        "/rest/v1/orders",
        {

          method:
            "POST",

          headers: {

            "Content-Type":
              "application/json",

            "apikey":
              SUPABASE_PUBLISHABLE_KEY,

            "Authorization":
              "Bearer " +
              SUPABASE_PUBLISHABLE_KEY,

            "Prefer":
              "return=representation"

          },

          body:
            JSON.stringify({

              customer_name:
                name,

              phone:
                phone,

              email:
                email || null,

              delivery_location:
                location,

              items:
                orderItems,

              total:
                total,

              status:
                "pending"

            })

        }
      );


    if (!response.ok) {

      const errorText =
        await response.text();

      throw new Error(
        errorText
      );

    }


    message.innerHTML = `

      ✅ Order created successfully!

      <br><br>

      <strong>
        Exact Amount to Pay:
        KES ${total.toLocaleString()}
      </strong>

      <br><br>

      M-Pesa payment connection will be
      activated next.

    `;


    message.style.color =
      "green";


    button.textContent =
      "Order Saved";


    cart = [];


    saveCart();

    updateCart();


  } catch (error) {

    console.error(error);


    message.textContent =
      "❌ Could not create the order. Please try again.";


    message.style.color =
      "red";


    button.disabled =
      false;


    button.textContent =
      "Pay KES " +
      total.toLocaleString();

  }

}
